<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" stroke="#5C4326" stroke-linecap="round" stroke-linejoin="round">
  <!-- Art Nouveau Corner Flourish & Foliage (Bottom-Right) -->
  <g stroke-width="2" transform="rotate(180 250 250)">
    <!-- Main undulating stem -->
    <path d="M 0,0 C 80,10 160,50 210,120 C 250,175 270,250 250,330 C 235,390 190,440 140,470" />
    <path d="M 0,0 C 10,80 50,160 120,210 C 175,250 250,270 330,250 C 390,235 440,190 470,140" />

    <!-- Organic whiplash branches -->
    <path d="M 140,80 C 180,90 230,120 250,170 C 265,210 240,250 200,260 C 165,270 130,240 135,200 C 140,165 180,150 210,165" />
    <path d="M 80,140 C 90,180 120,230 170,250 C 210,265 250,240 260,200 C 270,165 240,130 200,135 C 165,140 150,180 165,210" />

    <!-- Corner spiral motif -->
    <path d="M 15,15 C 60,30 110,70 125,120 C 135,160 110,195 75,190 C 45,185 30,150 45,120 C 60,95 95,90 115,105" />

    <!-- Stylized Art Nouveau leaves & petals -->
    <path d="M 210,120 C 230,90 270,80 300,95 C 310,130 280,160 250,170 Z" fill="#5C4326" fill-opacity="0.15" />
    <path d="M 120,210 C 90,230 80,270 95,300 C 130,310 160,280 170,250 Z" fill="#5C4326" fill-opacity="0.15" />
    <path d="M 170,50 C 200,30 240,35 260,60 C 265,90 235,110 205,105 Z" fill="#5C4326" fill-opacity="0.15" />
    <path d="M 50,170 C 30,200 35,240 60,260 C 90,265 110,235 105,205 Z" fill="#5C4326" fill-opacity="0.15" />

    <!-- Rose / floral bud crest -->
    <path d="M 270,230 C 290,210 330,220 340,245 C 345,275 315,300 285,290 C 265,280 260,250 270,230 Z" fill="#5C4326" fill-opacity="0.2" />
    <path d="M 285,240 C 295,230 315,235 320,250 C 320,265 305,275 295,270 Z" />

    <path d="M 230,270 C 210,290 220,330 245,340 C 275,345 300,315 290,285 C 280,265 250,260 230,270 Z" fill="#5C4326" fill-opacity="0.2" />
    <path d="M 240,285 C 230,295 235,315 250,320 C 265,320 275,305 270,295 Z" />

    <!-- Delicate swirling tendrils & stamens -->
    <path d="M 300,95 C 350,105 390,140 400,190 C 405,225 385,255 355,250 C 330,245 325,220 340,205 C 355,195 375,205 370,220" />
    <path d="M 95,300 C 105,350 140,390 190,400 C 225,405 255,385 250,355 C 245,330 220,325 205,340 C 195,355 205,375 220,370" />

    <!-- Tiny decorative buds -->
    <circle cx="400" cy="190" r="4" fill="#5C4326" />
    <circle cx="190" cy="400" r="4" fill="#5C4326" />
    <circle cx="340" cy="245" r="3.5" fill="#5C4326" />
    <circle cx="245" cy="340" r="3.5" fill="#5C4326" />
    <circle cx="470" cy="140" r="3" fill="#5C4326" />
    <circle cx="140" cy="470" r="3" fill="#5C4326" />
  </g>
</svg>
